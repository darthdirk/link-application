# Thingy:53 onboard sensors. No radio or network-core firmware is required.
CONFIG_SPI=y
CONFIG_BME680=y
CONFIG_BME680_TEMP_OVER_1X=y
CONFIG_BME680_PRESS_OVER_1X=y
CONFIG_BME680_HUMIDITY_OVER_1X=y
CONFIG_BME680_FILTER_OFF=y
CONFIG_BME680_HEATR_TEMP_LP=y
CONFIG_BME680_HEATR_DUR_LP=y
CONFIG_BMM150=y
CONFIG_BMM150_PRESET_LOW_POWER=y
CONFIG_BMM150_TRIGGER_NONE=y
CONFIG_ADXL362=y
CONFIG_ADXL362_ACCEL_RANGE_2G=y
CONFIG_ADXL362_ACCEL_ODR_12_5=y
CONFIG_ADXL362_TRIGGER_NONE=y
CONFIG_BMI270=y
CONFIG_BMI270_TRIGGER_NONE=y
CONFIG_ADC=y
CONFIG_VOLTAGE_DIVIDER=y
CONFIG_AUDIO=y
CONFIG_AUDIO_DMIC=y
