# Sleep until a real event or the next active sampling/flush deadline.
CONFIG_TICKLESS_KERNEL=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_BME280=y
CONFIG_BME280_MODE_FORCED=y
CONFIG_BME280_TEMP_OVER_1X=y
CONFIG_BME280_PRESS_OVER_1X=y
CONFIG_BME280_HUMIDITY_OVER_1X=y
CONFIG_BME280_FILTER_OFF=y

CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y

CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=y
CONFIG_USB_CDC_ACM=y
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_PRODUCT="LINK BME280 Logger"
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
# com.c checks DTR without the shell backend's periodic polling timer.
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=256
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_SHELL_CMD_BUFF_SIZE=160
CONFIG_SHELL_PROMPT_UART="logger> "
CONFIG_SHELL_CMDS_SELECT=y
CONFIG_SHELL_CMDS=y
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_MAX_LEVEL=4
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_BACKEND_UART=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_LOG_CMDS=n
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1536
CONFIG_HEAP_MEM_POOL_SIZE=0
CONFIG_THREAD_NAME=y
CONFIG_ASSERT=y
CONFIG_REBOOT=y
CONFIG_BT=n
CONFIG_NETWORKING=n

# Only the application core is used; SWD flashing replaces the factory bootloader.
CONFIG_BOOTLOADER_MCUBOOT=n
CONFIG_BOARD_ENABLE_CPUNET=n
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_INF=y
CONFIG_LOG_BLOCK_IN_THREAD=n
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

# QSPI flash has its own driver; no SPI sensor or bus is used.
CONFIG_SPI=n
