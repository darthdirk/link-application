name: Firmware and checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-and-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: link-application
      - uses: actions/setup-python@v5
        with:
          # Exercise the Python version supplied by Ubuntu 22.04.
          python-version: '3.10'
      - name: Install pinned tools, modules, and ARM SDK; run checks
        working-directory: link-application
        run: bash scripts/setup-local.sh --no-build
      - name: Build both boards and run checks
        working-directory: link-application
        shell: bash
        run: |
          source scripts/environment.sh
          just build_53
          just build_dk
          just check
