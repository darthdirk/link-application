repos:
  - repo: local
    hooks:
      - id: clang-format
        name: clang-format (check)
        entry: bash scripts/check.sh format-check
        language: system
        files: '^(app|tests)/.*\.[ch]$'
        pass_filenames: false
      - id: cppcheck
        name: cppcheck
        entry: bash scripts/check.sh cppcheck
        language: system
        files: '^(app|tests)/.*\.[ch]$'
        pass_filenames: false
      - id: unity
        name: Unity core tests
        entry: bash scripts/test.sh
        language: system
        files: '^(app|tests)/.*\.[ch]$'
        pass_filenames: false
      - id: capture
        name: Host capture tests
        entry: python -m unittest discover -s tests -p test_capture*.py
        language: system
        files: '^(scripts/capture.*|tests/test_capture.*)\.py$'
        pass_filenames: false
